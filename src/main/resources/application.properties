spring.application.name=reports-api-spring
server.port=8000

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/main}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:123}
# Raw JDBC (JdbcTemplate) ignores Hibernate default_schema; set schema on the pool connection.
spring.datasource.hikari.schema=main
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=main

app.jwt.secret=${JWT_SECRET:change-this-in-production-change-this-in-production}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

# Microsoft Entra ID (Office 365): add profile oauth2 and set AZURE_* (see application-oauth2.properties),
# or set standard Spring OAuth2 env vars / properties. Entra redirect URI: https://<api-host>/login/oauth2/code/azure

# Browser redirects after Microsoft login (SPA or web app URLs).
app.oauth2.redirect.success-uri=${APP_OAUTH2_SUCCESS_REDIRECT:http://localhost:3000/auth/callback}
app.oauth2.redirect.failure-uri=${APP_OAUTH2_FAILURE_REDIRECT:http://localhost:3000/login}

# Excel export: max rows written per request (safety cap)
app.report.export.max-rows=${REPORT_EXPORT_MAX_ROWS:100000}
# Excel export local storage directory (absolute or relative to app working dir)
app.report.export.storage-dir=${REPORT_EXPORT_STORAGE_DIR:storage/reports}

# Outstanding dashboard: cache TTL (seconds) for identical user + filter key
app.cache.outstanding-dashboard-ttl-seconds=${OUTSTANDING_DASHBOARD_CACHE_TTL_SECONDS:30}
