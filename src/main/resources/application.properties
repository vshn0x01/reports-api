spring.application.name=reports-api-spring
server.port=8000

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/reports}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

app.jwt.secret=${JWT_SECRET:change-this-in-production-change-this-in-production}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
